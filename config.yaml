#
#   vision:
#     enabled: true
#     auto_capture_interval: 5
#     gemini_model: "gemini-2.5-flash"
#
#   vtube:
#     port: 8001
#     mouse_tracking: true
#     mouse_sensitivity: 1.2
#     lip_sync: true
#     lip_sensitivity: 1.6
