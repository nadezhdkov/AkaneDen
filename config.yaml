# ------------------------------------------------------------
# Este arquivo define toda a configuração central do sistema
# Akane Den (VTuber AI modular).
#
# ✔ Baseado em validação via Pydantic
# ✔ Todos os campos possuem valores padrão
# ✔ Você pode sobrescrever apenas o necessário
#
# ------------------------------------------------------------
# 📦 EXEMPLO COMPLETO DE CONFIGURAÇÃO
# ------------------------------------------------------------
# (Use como referência para setups personalizados)
