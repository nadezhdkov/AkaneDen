# ------------------------------------------------------------
# 🧾 CHANGELOG / COMMITS POR SEÇÃO
# ------------------------------------------------------------
#
# [INPUT]
# feat(input): suporte a modo híbrido (PTT + VAD fallback)
# refactor(input): abstração de input desacoplada do ASR
#
# [ASR]
# feat(asr): suporte a Whisper e Sherpa-ONNX
# perf(asr): otimização de inferência em CUDA
#
# [TTS]
# feat(tts): motor híbrido Edge + ElevenLabs baseado em emoção
# feat(tts): controle fino de pitch e velocidade
#
# [VISION]
# feat(vision): captura automática de tela para contexto
# feat(vision): integração com Gemini Vision
#
# [VTUBE]
# feat(vtube): integração com VTube Studio via WebSocket
# feat(vtube): lip sync baseado em amplitude de áudio
#
# [BRAIN]
# feat(brain): suporte multi-provider (Gemini, Groq, Ollama, OpenAI)
# refactor(brain): gerenciamento de histórico com limite dinâmico
#
# [MEMORY]
# feat(memory): integração com ChromaDB
# feat(memory): embeddings semânticos locais
#
# [MCP]
# feat(mcp): suporte a ferramentas externas (web, automação, geração)
# feat(mcp): arquitetura extensível de plugins
#
# ============================================================

akane:
  # --- Input Mode ---
  ptt_key: "f2" # Tecla push-to-talk (customizável)
  input_mode: "ptt" # "ptt" (primário) ou "vad" (fallback)
  persona: "akane_default" # YAML de Perfil de Personagem

  # --- Speech-to-Text (ASR) ---
  asr:
    provider: "whisper" # "whisper" ou "sherpa"
    model_size: "medium" # tiny, small, medium, large
    device: "cpu" # cpu ou cuda
    language: "pt"
    # Sherpa-onnx (SenseVoiceSmall int8) — se provider="sherpa"
    # sherpa_model_path: "models/sensevoice-small.onnx"
    # sherpa_tokens_path: "models/tokens.txt"

  # --- Text-to-Speech (Motor Híbrido) ---
  tts:
    default_engine: "edge" # "edge", "elevenlabs", ou "sherpa"
    edge_voice: "pt-BR-ThalitaNeural"
    edge_pitch: "+12Hz"
    edge_rate: "+10%"
    elevenlabs_voice_id: "MEJe6hPrI48Kt2lFuVe3" # Yumi (feminina)
    elevenlabs_model: "eleven_flash_v2_5"
    emotion_threshold: 0.7 # Score mínimo para ativar ElevenLabs

  # --- Visão / Consciência Ambiental ---
  vision:
    enabled: true
    auto_capture_interval: 0 # Segundos entre capturas (0=desabilitado)
    gemini_model: "gemini-2.5-flash"

  # --- VTube Studio ---
  vtube:
    port: 8001
    mouse_tracking: true
    mouse_sensitivity: 1.0
    lip_sync: true
    lip_sensitivity: 1.5
    lip_smoothing: 0.4

  # --- Cérebro (LLM) ---
  brain:
    provider: "gemini" # "gemini", "groq", "ollama", "openai"
    temperature: 0.7
    max_history: 50

    # Gemini (default)
    gemini_model: "gemini-2.5-flash"

    # Groq (alternativo — requer GROQ_API_KEY)
    # groq_model: "llama-3.3-70b-versatile"

    # Ollama (local — requer servidor rodando)
    # ollama_model: "llama3.2"
    # ollama_base_url: "http://localhost:11434"

    # OpenAI (alternativo — requer OPENAI_API_KEY)
    # openai_model: "gpt-4o-mini"

  # --- Memória de Longo Prazo ---
  memory:
    enabled: true
    backend: "chromadb" # "chromadb", "letta", ou "none"
    db_path: "local_chroma_db"
    embedding_model: "all-MiniLM-L6-v2"

    # Letta (MemGPT) — para futuro
    # letta_base_url: "http://localhost:8283"
    # letta_agent_name: "akane"

  # --- MCP (Model Context Protocol) ---
  mcp:
    enabled: true
    tools:
      - "duckduckgo_search" # Pesquisa web em tempo real
      - "stagehand" # Navegação e leitura de páginas
      - "image_generation" # Geração de imagens (thumbnails, assets)
